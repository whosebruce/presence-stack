name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Example onboarding plan
        run: python -m presence_stack.onboard --answers config/onboarding-example.json --dry-run
      - name: Example cost estimate
        run: python -m presence_stack.estimate config/cost-example.json
      - name: Example hardware recommendation
        run: python -m presence_stack.recommend config/hardware-example.json
      - name: Secret-safe readiness report
        run: python -m presence_stack.doctor --json
      - name: Repository and Markdown verification
        run: python scripts/verify_repo.py
      - name: Tree, index, and history privacy scan
        run: python scripts/privacy_scan.py
